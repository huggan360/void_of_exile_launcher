name: Build launcher

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot and export templates
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          curl -sSLo godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && rm godot.zip
          curl -sSLo templates.tpz $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q templates.tpz templates/version.txt templates/linux_release.x86_64 \
            templates/windows_release_x86_64.exe templates/macos.zip
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $dest && mv templates/* $dest/ && rm -rf templates templates.tpz

      - name: Export Linux, Windows and macOS
        run: ./build.sh ./godot Linux Windows macOS && ls -la build

      - name: Signing tools and NSIS
        run: sudo apt-get update -q && sudo apt-get install -yq nsis osslsigncode zip

      # Windows code signing: set the repo secrets WINDOWS_CERT_PFX (the .pfx, base64) and
      # WINDOWS_CERT_PASSWORD. Without them the files ship unsigned (SmartScreen warns on first run).
      - name: Sign the Windows launcher
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -z "$PFX" ]; then echo "No certificate: the launcher stays unsigned"; exit 0; fi
          echo "$PFX" | base64 -d > cert.pfx
          sign() { osslsigncode sign -pkcs12 cert.pfx -pass "$PASS" -n "Void of Exile" -i https://void.plainshow.se \
            -h sha256 -t http://timestamp.digicert.com -in "$1" -out "$1.signed" && mv "$1.signed" "$1"; }
          sign build/windows/VoidOfExileLauncher.exe
          (cd build/windows && rm -f ../VoidOfExileLauncher-Windows.zip && zip -q -9 ../VoidOfExileLauncher-Windows.zip VoidOfExileLauncher.exe)

      - name: Online installer
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          version="$(sed -nE 's/^const VERSION := "([^"]+)".*/\1/p' scripts/launcher.gd)"
          makensis -V2 -DVERSION="$version" installer/setup.nsi
          if [ -n "$PFX" ]; then
            osslsigncode sign -pkcs12 cert.pfx -pass "$PASS" -n "Void of Exile Setup" -i https://void.plainshow.se \
              -h sha256 -t http://timestamp.digicert.com -in build/VoidOfExileSetup.exe -out build/VoidOfExileSetup.signed.exe
            mv build/VoidOfExileSetup.signed.exe build/VoidOfExileSetup.exe
          fi
          rm -f cert.pfx
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: |
            build/*.zip
            build/VoidOfExileSetup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.zip
            build/VoidOfExileSetup.exe
          make_latest: true
